<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="740" viewBox="0 0 1320 740"><rect width="1320" height="740" fill="#F8F7F3"/><g font-family="Avenir Next,Arial,sans-serif"><text x="50" y="50" font-size="12" letter-spacing="2" fill="#72727A">CAMPUS MARKETPLACE / BRAND CONCEPTS</text><text x="50" y="110" font-size="40" font-weight="650" letter-spacing="-1.5" fill="#25252C">A name that feels like campus.</text><text x="50" y="145" font-size="16" fill="#74747D">Three directions for your marketplace. My pick: Hoodlet.</text><g transform="translate(50 190)"><rect width="390" height="460" rx="18" fill="white" stroke="#DEDED8"/><text x="22" y="31" fill="#777780" font-size="11">01</text><text x="368" y="31" text-anchor="end" fill="#5147F8" font-size="11" font-weight="650">MY PICK</text><path d="M1 50h388v228H1Z" fill="#F0EEFF"/><g transform="translate(153 68) scale(.84)" style="color:#5147F8"><path d="M25 13h47c11 0 19 8 19 19v32c0 11-8 19-19 19H48L27 96V83h-2C14 83 6 75 6 64V32c0-11 8-19 19-19Z" fill="currentColor"/><path d="M32 30v36m0-17c0-17 33-17 33 0v17" fill="none" stroke="var(--cutout,white)" stroke-width="9" stroke-linecap="round"/></g><text x="195" y="229" text-anchor="middle" fill="#5147F8" font-size="48" font-weight="750" letter-spacing="-2.5">hoodlet</text><text x="23" y="317" fill="#26262D" font-size="23" font-weight="650">Hoodlet</text><text x="23" y="345" fill="#53535D" font-size="14">Short. Friendly. Easy to remember.</text><text x="23" y="387" fill="#777780" font-size="13">A conversation bubble + a lowercase h.</text><text x="23" y="409" fill="#777780" font-size="13">Friendly, simple, and made for campus.</text><rect x="24" y="431" width="37" height="6" rx="3" fill="#5147F8"/><rect x="66" y="431" width="37" height="6" rx="3" fill="#FFC5A4"/><rect x="108" y="431" width="37" height="6" rx="3" fill="#F0EEFF"/></g><g transform="translate(465 190)"><rect width="390" height="460" rx="18" fill="white" stroke="#DEDED8"/><text x="22" y="31" fill="#777780" font-size="11">02</text><text x="368" y="31" text-anchor="end" fill="#116757" font-size="11" font-weight="650">THE CLEAR CHOICE</text><path d="M1 50h388v228H1Z" fill="#EDF5F0"/><g transform="translate(153 68) scale(.84)" style="color:#116757"><rect x="15" y="17" width="17" height="65" rx="8.5" fill="currentColor"/><rect x="66" y="17" width="17" height="65" rx="8.5" fill="currentColor"/><rect x="23" y="48" width="52" height="14" rx="7" fill="currentColor"/><rect x="39" y="16" width="16" height="26" rx="6" fill="currentColor" transform="rotate(-12 47 29)"/></g><text x="195" y="229" text-anchor="middle" fill="#116757" font-size="48" font-weight="750" letter-spacing="-2.5">hoodshelf</text><text x="23" y="317" fill="#26262D" font-size="23" font-weight="650">HoodShelf</text><text x="23" y="345" fill="#53535D" font-size="14">Your campus, all on one shelf.</text><text x="23" y="387" fill="#777780" font-size="13">A compact H, built from a shelf and a book.</text><text x="23" y="409" fill="#777780" font-size="13">A clear home for every kind of product.</text><rect x="24" y="431" width="37" height="6" rx="3" fill="#116757"/><rect x="66" y="431" width="37" height="6" rx="3" fill="#D9F27A"/><rect x="108" y="431" width="37" height="6" rx="3" fill="#EDF5F0"/></g><g transform="translate(880 190)"><rect width="390" height="460" rx="18" fill="white" stroke="#DEDED8"/><text x="22" y="31" fill="#777780" font-size="11">03</text><text x="368" y="31" text-anchor="end" fill="#BE462D" font-size="11" font-weight="650">THE LIFESTYLE CHOICE</text><path d="M1 50h388v228H1Z" fill="#FFF0E8"/><g transform="translate(153 68) scale(.84)" style="color:#BE462D"><path d="M21 19v59m53-59v59M22 63c9-24 43-2 52-27" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/><path d="m47 5 3.5 8.5L59 17l-8.5 3.5L47 29l-3.5-8.5L35 17l8.5-3.5Z" fill="currentColor"/></g><text x="195" y="229" text-anchor="middle" fill="#BE462D" font-size="48" font-weight="750" letter-spacing="-2.5">hoodlane</text><text x="23" y="317" fill="#26262D" font-size="23" font-weight="650">Hoodlane</text><text x="23" y="345" fill="#53535D" font-size="14">The place your campus checks first.</text><text x="23" y="387" fill="#777780" font-size="13">Two paths connected by a small discovery.</text><text x="23" y="409" fill="#777780" font-size="13">A digital shopping lane for campus life.</text><rect x="24" y="431" width="37" height="6" rx="3" fill="#BE462D"/><rect x="66" y="431" width="37" height="6" rx="3" fill="#FFCF84"/><rect x="108" y="431" width="37" height="6" rx="3" fill="#FFF0E8"/></g><text x="50" y="698" fill="#8A8A92" font-size="12">Original vector logo concepts · Your current site still uses Hostel OLX.</text><text x="1270" y="698" text-anchor="end" fill="#8A8A92" font-size="12">Domain availability pending</text></g></svg>